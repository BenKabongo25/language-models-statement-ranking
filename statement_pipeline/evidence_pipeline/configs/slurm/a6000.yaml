# Example SLURM profile: adapt partition / account / qos / resources to your cluster.
profile_name: a6000
partition: gpu            # your cluster's GPU partition
nodelist: null            # optional node name
gpu_type: A6000
default_gpus: 1
max_gpus: 3
gpus_per_worker: 1
tensor_parallel_size: 1
cpus_per_worker: 8
memory_per_gpu_gb: 52
time: "48:00:00"
conda_env: statementrec
prefetch_model: true
gpu_bind: single:1
disable_flashinfer_sampler: true
account: null
qos: null
exclusive: false
