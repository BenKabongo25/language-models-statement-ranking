# Example SLURM profile: adapt partition / account / qos / resources to your cluster.
profile_name: h200
partition: gpu            # your cluster's GPU partition
nodelist: null            # optional node name
gpu_type: H200
default_gpus: 1
max_gpus: 2
gpus_per_worker: 1
tensor_parallel_size: 1
cpus_per_worker: 12
memory_per_gpu_gb: 128
time: "48:00:00"
conda_env: statementrec
prefetch_model: true
gpu_bind: single:1
disable_flashinfer_sampler: true
account: null
qos: null
exclusive: false
